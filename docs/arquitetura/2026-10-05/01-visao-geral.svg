<text x="1407" y="1167" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#52647b">Integração local disponível</text>
<text x="65" y="1268" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#172b43">Leitura do mapa: os setores locais são módulos do mesmo projeto. As tarefas científicas longas usam subprocessos.</text>
<text x="65" y="1297.82" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#172b43">MiniLM e o reordenador executam inferência local; os autoencoders científicos são treinados em um fluxo separado.</text>

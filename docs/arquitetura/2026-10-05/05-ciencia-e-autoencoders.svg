<rect x="66" y="503" width="5" height="199" rx="2" fill="#527c32" stroke="#527c32" stroke-width="1"/>
<text x="87" y="501" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#172b43">2 Modelos de confiabilidade</text>
<text x="87" y="544.5" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#172b43">Confiabilidade, disponibilidade e manutenção:</text>
<text x="87" y="574.32" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#172b43">exponencial, Weibull e sistemas em série ou</text>
<text x="87" y="604.1400000000001" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#172b43">paralelo.</text>
<text x="87" y="633.9600000000002" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#172b43">Cenários e premissas são explícitos.</text>
<text x="87" y="687" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#52647b">science/ram.py</text>
<rect x="65" y="770" width="530" height="225" rx="15" fill="#eaf4e5" stroke="#527c32" stroke-width="1.4"/>
<rect x="66" y="788" width="5" height="189" rx="2" fill="#527c32" stroke="#527c32" stroke-width="1"/>
<text x="87" y="786" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#172b43">3 Risco e componentes</text>
<text x="87" y="829.5" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#172b43">FMECA: modos de falha e prioridade de risco.</text>
<text x="87" y="859.32" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#172b43">Taxas de falha e cenários de reparo têm análise</text>
<text x="87" y="889.1400000000001" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#172b43">separada das notas de risco.</text>
<text x="87" y="962" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#52647b">science/fmeca.py · components.py</text>
<polyline points="330,720 330,770" fill="none" stroke="#8b9cb0" stroke-width="2"/><polygon points="330,770 325.21537912477646,760.0950818741205 334.78462087522354,760.0950818741205" fill="#8b9cb0"/>

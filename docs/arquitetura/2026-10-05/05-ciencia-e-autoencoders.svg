<text x="682" y="438" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#527c32">ESPECIALIZAÇÃO · PESQUISA DE INVERSORES / GPVS</text>
<polyline points="335,360 335,485" fill="none" stroke="#8b9cb0" stroke-width="2"/><polygon points="335,485 330.21537912477646,475.0950818741206 339.78462087522354,475.0950818741206" fill="#8b9cb0"/>

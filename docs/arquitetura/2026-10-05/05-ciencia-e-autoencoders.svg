<text x="77" y="251" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#172b43">1 O pesquisador inicia uma operação</text>
<text x="77" y="294.5" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#172b43">Aba Ciência ou CLI → comandos definidos no projeto. Preparação, treino e avaliação GPVS usam subprocessos; o chat não dispara código livre.</text>
<text x="77" y="327" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#52647b">interfaces/web/gpvs_runs.py · cli.py</text>
